<!doctype html>
<html class="no-js" lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GIS 교육 · OpenLayers × MapPrime 뷰어</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="VWorld 배경 위에 MapPrime OGC(WMTS/WFS/WMS) 레이어를 표출하는 실습 뷰어">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#fafafa">
</head>

<body>

  <div id="map"></div>

  <aside id="sidepanel">
    <div class="tabs">
      <button class="tab active" data-tab="attr">건물속성 조회</button>
      <button class="tab" data-tab="layer">레이어 정보 조회</button>
    </div>

    <div id="tab-attr" class="tab-body active">
      <label class="field">레이어
        <select id="attr-layer-select"></select>
      </label>
      <div id="attr-cards" class="cards"></div>
    </div>

    <div id="tab-layer" class="tab-body">
      <p class="hint">클릭하여 레이어를 켜고 끕니다.</p>
      <div id="layer-list" class="layer-list"></div>
    </div>
  </aside>

  <div id="panel">
    <h1>배경지도</h1>
    <label><input type="checkbox" id="base-toggle" checked> 배경 표시</label>
    <label class="row">종류 <select id="base-select"></select></label>
    <label><input type="checkbox" id="hybrid-toggle"> 하이브리드(주기)</label>
    <hr>
    <label><input type="checkbox" id="style-toggle"> 스타일 변경 <em>(빨강/파랑/초록)</em></label>
    <p class="hint">피처를 클릭하면 속성을 조회합니다.</p>
  </div>

  <!-- 클릭 속성조회 팝업 -->
  <div id="popup" class="ol-popup">
    <a href="#" id="popup-closer" class="ol-popup-closer"></a>
    <div id="popup-content"></div>
  </div>

  <script src="js/app.js"></script>

</body>

</html>
